name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests only: the Elasticsearch integration test is skipped without ES_LOCAL_PASSWORD.
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Check the demo question set and the sample board stay in sync
        run: |
          grep -vE '^\s*(#|$)' demo/questions.txt | sort > /tmp/questions.txt
          grep -oE '^    "[^"]+"' src/main/resources/static/js/sample-questions.js | sed -E 's/^    "(.*)"$/\1/' | sort > /tmp/sample.txt
          diff -u /tmp/questions.txt /tmp/sample.txt

      - name: Build the container image
        run: docker build -t askonce:ci .
